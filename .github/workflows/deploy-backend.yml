name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'       # Only trigger when backend code changes
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Test
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────
  # Job 2: Deploy (only after tests pass)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Load NVM and Node/npm into PATH for non-interactive SSH sessions
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin"

            echo "🚀 Starting deployment..."
            echo "Node: $(node -v 2>/dev/null || echo 'not found') | npm: $(npm -v 2>/dev/null || echo 'not found')"

            # Navigate to project directory
            cd ~/voice-news-reader

            # Pull latest code
            echo "📥 Pulling latest code..."
            git pull origin main

            # Install backend dependencies
            echo "📦 Installing dependencies..."
            cd backend
            npm ci --production=false

            # Build TypeScript
            echo "🔨 Building TypeScript..."
            npm run build

            # Remove dev dependencies after build
            npm prune --production

            # Restart the application with PM2
            echo "♻️ Restarting application..."
            pm2 restart voice-news-backend || pm2 start dist/index.js --name voice-news-backend

            # Save PM2 process list
            pm2 save

            echo "✅ Deployment completed successfully!"
